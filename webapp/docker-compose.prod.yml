services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: aki_eletronicos
      MYSQL_USER: aki_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://aki_user:${MYSQL_PASSWORD}@db:3306/aki_eletronicos
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3012
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      NODE_ENV: production
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}/api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    environment:
      API_URL: http://api:3012
      NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}/api
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait;
      done"

volumes:
  db_data:
  api_uploads:
  certbot_www:
  certbot_certs:
